version: 0.{build}
image: Visual Studio 2019
configuration: Release
platform: x64

environment:
  nodejs_version: "20"
  KEY_1CV8T:
    secure: OolAVEKkEg1cGCpG/VK2FaM0LWrPgMR/Kn4nTLYyKR0=

install:
  - git clone -q --branch=platform https://github.com/lintest/tools1c.git bin
  - cd bin
  - 7z x tools1c.part01.rar -p%KEY_1CV8T%
  - cd ..

  - git clone -q --branch=oscript.w64 https://github.com/lintest/tools1c.git oscript
  - cd oscript
  - 7z x *.zip
  - cd ..

  - ps: Install-Product node $env:nodejs_version
  - ps: $env:PACKAGE_VERSION = (Get-Content -Raw -Path package.json | ConvertFrom-Json).version
  - ps: Update-AppveyorBuild -Version "$env:PACKAGE_VERSION.$env:APPVEYOR_BUILD_NUMBER$env:LINTEST_FLAG"
  - ps: $package = (Get-Content -Raw -Path package.json | ConvertFrom-Json)
  - ps: $package.version = "$env:APPVEYOR_BUILD_VERSION"
  - ps: $package | ConvertTo-Json | Out-File -Encoding UTF8 version.json
  - npm -q --no-progress ci

build_script:
  - npm run buildci
  # index.html самодостаточен: скрипты встроены внутрь страницы,
  # внешние файлы в поставку не нужны.
  - 7z a VAEditor.zip %CD%/dist/index.html
  - chcp 65001 > nul & .\oscript\bin\oscript .\\tools\\onescript\\ZipTemplates.os

after_build:
  - mkdir database
  # Защита от опасных действий не даёт запустить внешнюю обработку: клиент ждёт
  # нажатия «Да» в диалоге и в CI висит до таймаута. Файл настроек платформы
  # лежит в conf рядом с каталогом bin.
  - ps: |
      $conf = Join-Path $env:APPVEYOR_BUILD_FOLDER 'conf'
      New-Item -ItemType Directory -Force -Path $conf | Out-Null
      Set-Content -Path (Join-Path $conf 'conf.cfg') -Value 'DisableUnsafeActionProtection=.*' -Encoding ASCII
  - bin\1cv8t.exe CREATEINFOBASE File=%CD%/database
  - bin\1cv8t.exe DESIGNER /F %CD%/database /LoadConfigFromFiles %CD%/config /UpdateDBCfg /DisableStartupDialogs /DisableStartupMessages
  - bin\1cv8t.exe DESIGNER /F %CD%/database /LoadExternalDataProcessorOrReportFromFiles example/VAEditorSample.xml VAEditorSample.epf /DisableStartupDialogs /DisableStartupMessages /Out example.log
  - appveyor PushArtifact example.log
  - appveyor PushArtifact VAEditor.zip
  - appveyor PushArtifact VAEditorSample.epf
  # Обработку открывает сама тестовая конфигурация с выключенными
  # предупреждениями защиты от опасных действий, поэтому /Execute не нужен.
  # Клиент — толстый: форму внешней обработки можно получить только в нём.
  # Ждём результат с таймаутом: клиент может зависнуть (диалог, упавший скрипт).
  - ps: |
      $root = $env:APPVEYOR_BUILD_FOLDER
      $success = Join-Path $root 'success.txt'
      $client = Join-Path $root 'bin\1cv8t.exe'
      $epf = Join-Path $root 'VAEditorSample.epf'
      $db = Join-Path $root 'database'
      $timeout = 300
      if (Test-Path $success) { Remove-Item -Force $success }
      Write-Host "> 1cv8t ENTERPRISE /F $db /C autotest;$epf (timeout ${timeout}s)"
      Start-Process -FilePath $client -ArgumentList @('ENTERPRISE', '/LRU', "/F$db", '/C', "autotest;$epf") | Out-Null
      $deadline = (Get-Date).AddSeconds($timeout)
      while ((Get-Date) -lt $deadline -and -not (Test-Path $success)) { Start-Sleep -Seconds 2 }
      if (-not (Test-Path $success)) {
        Get-Process -Name '1cv8*' -ErrorAction SilentlyContinue | Stop-Process -Force
        throw "autotest did not finish in ${timeout}s: success.txt not created"
      }
      Write-Host 'autotest passed: success.txt created'

on_failure:
  - ps: Get-Process -Name '1cv8*' -ErrorAction SilentlyContinue | Stop-Process -Force
  - appveyor PushArtifact example.log

artifacts:
  - path: AutoTest.zip
  - path: VAEditor.zip
  - path: VAEditorSample.epf

deploy:
  - provider: GitHub
    auth_token:
      secure: v7P89NQ2I5+WGNNdhpFrZEt6OCTPf8A8VSC5rttZMXh3DJ2fTChNEjZ1Wvm3kfBt
    repository: Pr-Mex/VAEditor
    artifact: VAEditor.zip, VAEditorSample.epf
    draft: true
    prerelease: true
    force_update: true
    on:
      branch: master
